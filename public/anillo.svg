<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Anillo">
  <!-- Papel marfil de la web: en la pestaña el icono queda como un sello -->
  <rect width="32" height="32" rx="4" fill="#F4F0E7"/>

  <!-- La alianza. Trazo grueso para que siga leyéndose a 16 px -->
  <circle cx="16" cy="19.5" r="8" fill="none" stroke="#A6813C" stroke-width="3"/>

  <!-- La piedra, en marino para que contraste con el oro -->
  <path d="M16 3 21 8 16 13.4 11 8Z" fill="#1E2A44"/>
</svg>
