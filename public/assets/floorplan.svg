<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" style="background:#F5F0E8">
  <!-- Grid / background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8DFD0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="520" fill="url(#grid)"/>

  <!-- Outer wall -->
  <rect x="80" y="60" width="640" height="400" fill="none" stroke="#1A1714" stroke-width="8"/>

  <!-- Interior walls -->
  <!-- Vertical center wall -->
  <line x1="360" y1="60" x2="360" y2="300" stroke="#1A1714" stroke-width="5"/>
  <!-- Horizontal mid wall (lower) -->
  <line x1="80" y1="300" x2="550" y2="300" stroke="#1A1714" stroke-width="5"/>
  <!-- Vertical right section -->
  <line x1="550" y1="300" x2="550" y2="460" stroke="#1A1714" stroke-width="5"/>
  <!-- Small horizontal top right -->
  <line x1="550" y1="170" x2="720" y2="170" stroke="#1A1714" stroke-width="5"/>

  <!-- Doors (arcs) -->
  <!-- Salon door -->
  <path d="M 200 300 A 40 40 0 0 1 200 260" fill="none" stroke="#1A1714" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="200" y1="300" x2="200" y2="260" stroke="#1A1714" stroke-width="1.5"/>
  <!-- Cocina door -->
  <path d="M 480 300 A 35 35 0 0 0 445 300" fill="none" stroke="#1A1714" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="480" y1="300" x2="480" y2="265" stroke="#1A1714" stroke-width="1.5"/>
  <!-- Dormitorio door -->
  <path d="M 630 300 A 36 36 0 0 1 630 264" fill="none" stroke="#1A1714" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="630" y1="300" x2="630" y2="264" stroke="#1A1714" stroke-width="1.5"/>

  <!-- Windows -->
  <rect x="130" y="56" width="80" height="8" fill="#C8A07A" opacity="0.7"/>
  <rect x="280" y="56" width="60" height="8" fill="#C8A07A" opacity="0.7"/>
  <rect x="400" y="56" width="80" height="8" fill="#C8A07A" opacity="0.7"/>
  <rect x="600" y="56" width="100" height="8" fill="#C8A07A" opacity="0.7"/>
  <rect x="76" y="320" width="8" height="80" fill="#C8A07A" opacity="0.7"/>
  <rect x="76" y="130" width="8" height="100" fill="#C8A07A" opacity="0.7"/>
  <rect x="716" y="200" width="8" height="80" fill="#C8A07A" opacity="0.7"/>

  <!-- Space labels -->
  <text x="220" y="195" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="300" letter-spacing="3" fill="#1A1714" opacity="0.5">SALÓN</text>
  <text x="455" y="225" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="300" letter-spacing="3" fill="#1A1714" opacity="0.5">COCINA</text>
  <text x="625" y="380" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="300" letter-spacing="3" fill="#1A1714" opacity="0.5">DORMITORIO</text>
  <text x="270" y="400" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="300" letter-spacing="3" fill="#1A1714" opacity="0.5">EXTERIOR</text>

  <!-- North arrow -->
  <g transform="translate(740,480)">
    <line x1="0" y1="14" x2="0" y2="-14" stroke="#C8A07A" stroke-width="1"/>
    <polygon points="0,-18 -5,-8 5,-8" fill="#C8A07A"/>
    <text x="0" y="26" text-anchor="middle" font-family="Montserrat" font-size="9" font-weight="300" fill="#C8A07A" letter-spacing="1">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80,490)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#1A1714" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#1A1714" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="-4" x2="60" y2="4" stroke="#1A1714" stroke-width="1" opacity="0.4"/>
    <text x="30" y="-8" text-anchor="middle" font-family="Montserrat" font-size="7" font-weight="300" fill="#1A1714" opacity="0.4" letter-spacing="1">5 m</text>
  </g>
</svg>
