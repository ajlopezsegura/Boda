<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(184,152,72,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" fill="#0d1117"/>
  <rect width="860" height="560" fill="url(#grid)"/>

  <!-- ── Room fills (very subtle) ── -->
  <!-- Salón -->
  <rect x="80" y="60" width="380" height="240" fill="rgba(184,152,72,0.03)"/>
  <!-- Cocina -->
  <rect x="460" y="60" width="200" height="180" fill="rgba(184,152,72,0.03)"/>
  <!-- Terraza -->
  <rect x="660" y="60" width="140" height="440" fill="rgba(184,152,72,0.02)" stroke="rgba(184,152,72,0.2)" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Hall -->
  <rect x="80" y="300" width="140" height="200" fill="rgba(184,152,72,0.03)"/>
  <!-- Dormitorio principal -->
  <rect x="220" y="300" width="240" height="200" fill="rgba(184,152,72,0.03)"/>
  <!-- Baño suite -->
  <rect x="460" y="240" width="200" height="130" fill="rgba(184,152,72,0.03)"/>
  <!-- Dormitorio 2 -->
  <rect x="460" y="370" width="200" height="130" fill="rgba(184,152,72,0.03)"/>

  <!-- ── Outer walls ── -->
  <rect x="80" y="60" width="580" height="440" fill="none" stroke="rgba(184,152,72,0.75)" stroke-width="4"/>

  <!-- ── Interior walls ── -->
  <!-- Vertical: separates salon/hall from cocina/baños -->
  <line x1="460" y1="60" x2="460" y2="500" stroke="rgba(184,152,72,0.65)" stroke-width="3"/>
  <!-- Horizontal: separates salon from hall/dormitorio -->
  <line x1="80" y1="300" x2="460" y2="300" stroke="rgba(184,152,72,0.65)" stroke-width="3"/>
  <!-- Vertical: separates hall from dormitorio principal -->
  <line x1="220" y1="300" x2="220" y2="500" stroke="rgba(184,152,72,0.65)" stroke-width="3"/>
  <!-- Horizontal: separates cocina from baño suite -->
  <line x1="460" y1="240" x2="660" y2="240" stroke="rgba(184,152,72,0.65)" stroke-width="3"/>
  <!-- Horizontal: separates baño suite from dormitorio 2 -->
  <line x1="460" y1="370" x2="660" y2="370" stroke="rgba(184,152,72,0.65)" stroke-width="3"/>
  <!-- Vertical: separates terraza from interior -->
  <line x1="660" y1="60" x2="660" y2="500" stroke="rgba(184,152,72,0.5)" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- ── Doors (arc symbols) ── -->
  <!-- Salon main door -->
  <path d="M 80 400 A 36 36 0 0 1 116 400" fill="none" stroke="rgba(184,152,72,0.45)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="80" y1="400" x2="80" y2="364" stroke="rgba(184,152,72,0.45)" stroke-width="1.5"/>
  <!-- Hall to dormitorio -->
  <path d="M 220 420 A 30 30 0 0 0 220 390" fill="none" stroke="rgba(184,152,72,0.45)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="220" y1="420" x2="250" y2="420" stroke="rgba(184,152,72,0.45)" stroke-width="1.5"/>
  <!-- Cocina door -->
  <path d="M 460 160 A 32 32 0 0 0 492 160" fill="none" stroke="rgba(184,152,72,0.45)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="460" y1="128" x2="460" y2="160" stroke="rgba(184,152,72,0.45)" stroke-width="1.5"/>
  <!-- Dormitorio 2 door -->
  <path d="M 520 370 A 30 30 0 0 1 550 370" fill="none" stroke="rgba(184,152,72,0.45)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="520" y1="370" x2="520" y2="340" stroke="rgba(184,152,72,0.45)" stroke-width="1.5"/>

  <!-- ── Windows ── -->
  <rect x="130" y="57" width="100" height="6" fill="rgba(184,152,72,0.5)" rx="1"/>
  <rect x="290" y="57" width="100" height="6" fill="rgba(184,152,72,0.5)" rx="1"/>
  <rect x="480" y="57" width="80" height="6" fill="rgba(184,152,72,0.5)" rx="1"/>
  <rect x="77" y="140" width="6" height="80" fill="rgba(184,152,72,0.5)" rx="1"/>
  <rect x="77" y="360" width="6" height="80" fill="rgba(184,152,72,0.5)" rx="1"/>
  <rect x="654" y="100" width="6" height="100" fill="rgba(184,152,72,0.35)" rx="1"/>
  <rect x="654" y="280" width="6" height="100" fill="rgba(184,152,72,0.35)" rx="1"/>

  <!-- ── Room labels ── -->
  <text x="270" y="185" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="300" letter-spacing="3.5" fill="rgba(244,241,234,0.45)">SALÓN · COMEDOR</text>
  <text x="560" y="156" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="300" letter-spacing="3" fill="rgba(244,241,234,0.45)">COCINA</text>
  <text x="150" y="408" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="2.5" fill="rgba(244,241,234,0.4)">HALL</text>
  <text x="340" y="400" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="300" letter-spacing="3" fill="rgba(244,241,234,0.45)">DORMITORIO</text>
  <text x="340" y="415" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="2" fill="rgba(184,152,72,0.5)">PRINCIPAL</text>
  <text x="557" y="308" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8.5" font-weight="300" letter-spacing="2.5" fill="rgba(244,241,234,0.4)">BAÑO SUITE</text>
  <text x="557" y="438" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="300" letter-spacing="3" fill="rgba(244,241,234,0.45)">DORMITORIO 2</text>
  <text x="710" y="262" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="2.5" fill="rgba(244,241,234,0.35)">TERRAZA</text>

  <!-- ── Surface tags ── -->
  <text x="270" y="205" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.4)">48 m²</text>
  <text x="560" y="172" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.4)">18 m²</text>
  <text x="340" y="432" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.4)">32 m²</text>
  <text x="557" y="450" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.4)">22 m²</text>
  <text x="710" y="278" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.35)">24 m²</text>

  <!-- ── Accent line top ── -->
  <line x1="80" y1="52" x2="660" y2="52" stroke="rgba(184,152,72,0.2)" stroke-width="1"/>

  <!-- ── North arrow ── -->
  <g transform="translate(800,490)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(184,152,72,0.3)" stroke-width="1"/>
    <polygon points="0,-12 -4,-4 4,-4" fill="rgba(184,152,72,0.8)"/>
    <polygon points="0,12 -4,4 4,4" fill="rgba(184,152,72,0.25)"/>
    <text x="0" y="28" text-anchor="middle" font-family="Montserrat" font-size="8" font-weight="300" fill="rgba(184,152,72,0.7)" letter-spacing="2">N</text>
  </g>

  <!-- ── Scale bar ── -->
  <g transform="translate(100,530)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="40" y1="-3" x2="40" y2="3" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="80" y1="-5" x2="80" y2="5" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <text x="40" y="-10" text-anchor="middle" font-family="Montserrat" font-size="7.5" font-weight="300" fill="rgba(184,152,72,0.45)" letter-spacing="1.5">5 m</text>
  </g>

  <!-- ── Project label ── -->
  <text x="430" y="538" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="5" fill="rgba(184,152,72,0.35)">LAS CONCHAS · MARBELLA</text>
</svg>
