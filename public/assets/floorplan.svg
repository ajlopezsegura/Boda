<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(184,152,72,0.05)" stroke-width="0.5"/>
    </pattern>
    <!-- Hatch for staircase -->
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(184,152,72,0.2)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#0d1117"/>
  <rect width="900" height="580" fill="url(#grid)"/>

  <!-- ── Compass label top ── -->
  <text x="450" y="34" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="3" fill="rgba(184,152,72,0.4)">SUR · VISTAS AL MAR</text>
  <line x1="200" y1="30" x2="310" y2="30" stroke="rgba(184,152,72,0.15)" stroke-width="0.5"/>
  <line x1="590" y1="30" x2="700" y2="30" stroke="rgba(184,152,72,0.15)" stroke-width="0.5"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- OUTER BUILDING ENVELOPE                        -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="50" y="45" width="800" height="490" fill="none" stroke="rgba(184,152,72,0.8)" stroke-width="4"/>

  <!-- ── Unit fills ── -->
  <rect x="52" y="47" width="268" height="353" fill="rgba(184,152,72,0.03)"/>
  <rect x="322" y="47" width="256" height="353" fill="rgba(184,152,72,0.03)"/>
  <rect x="580" y="47" width="268" height="353" fill="rgba(184,152,72,0.03)"/>
  <!-- Corridor fill -->
  <rect x="52" y="400" width="796" height="133" fill="rgba(184,152,72,0.02)"/>

  <!-- ── Interior walls ── -->
  <!-- Party wall A/B -->
  <line x1="320" y1="45" x2="320" y2="400" stroke="rgba(184,152,72,0.7)" stroke-width="4"/>
  <!-- Party wall B/C -->
  <line x1="578" y1="45" x2="578" y2="400" stroke="rgba(184,152,72,0.7)" stroke-width="4"/>
  <!-- Corridor wall -->
  <line x1="50" y1="400" x2="850" y2="400" stroke="rgba(184,152,72,0.7)" stroke-width="3"/>

  <!-- Sub-walls inside units (rooms) -->
  <!-- Unit A interior -->
  <line x1="200" y1="47" x2="200" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>
  <line x1="52" y1="240" x2="320" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>
  <!-- Unit B interior -->
  <line x1="450" y1="47" x2="450" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>
  <line x1="322" y1="240" x2="578" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>
  <!-- Unit C interior -->
  <line x1="700" y1="47" x2="700" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>
  <line x1="578" y1="240" x2="848" y2="240" stroke="rgba(184,152,72,0.4)" stroke-width="2"/>

  <!-- ── Elevator shaft ── -->
  <rect x="370" y="418" width="80" height="90" fill="rgba(184,152,72,0.06)" stroke="rgba(184,152,72,0.5)" stroke-width="1.5"/>
  <!-- Elevator cross (symbol) -->
  <line x1="370" y1="418" x2="450" y2="508" stroke="rgba(184,152,72,0.3)" stroke-width="1"/>
  <line x1="450" y1="418" x2="370" y2="508" stroke="rgba(184,152,72,0.3)" stroke-width="1"/>
  <text x="410" y="470" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.5)">ASCENSOR</text>

  <!-- ── Staircase (hatch) ── -->
  <rect x="480" y="418" width="110" height="90" fill="url(#hatch)" stroke="rgba(184,152,72,0.45)" stroke-width="1.5"/>
  <!-- Stair treads -->
  <line x1="480" y1="430" x2="590" y2="430" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <line x1="480" y1="442" x2="590" y2="442" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <line x1="480" y1="454" x2="590" y2="454" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <line x1="480" y1="466" x2="590" y2="466" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <line x1="480" y1="478" x2="590" y2="478" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <line x1="480" y1="490" x2="590" y2="490" stroke="rgba(184,152,72,0.25)" stroke-width="0.8"/>
  <text x="535" y="514" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.5)">ESCALERA</text>

  <!-- ── Windows (south facade) ── -->
  <rect x="80" y="42" width="100" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>
  <rect x="200" y="42" width="80" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>
  <rect x="355" y="42" width="80" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>
  <rect x="455" y="42" width="80" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>
  <rect x="615" y="42" width="80" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>
  <rect x="720" y="42" width="80" height="6" fill="rgba(184,152,72,0.55)" rx="1"/>

  <!-- Windows (side facades) -->
  <rect x="46" y="100" width="6" height="70" fill="rgba(184,152,72,0.4)" rx="1"/>
  <rect x="46" y="280" width="6" height="70" fill="rgba(184,152,72,0.4)" rx="1"/>
  <rect x="848" y="100" width="6" height="70" fill="rgba(184,152,72,0.4)" rx="1"/>
  <rect x="848" y="280" width="6" height="70" fill="rgba(184,152,72,0.4)" rx="1"/>

  <!-- ── Doors ── -->
  <!-- Unit A entrance from corridor -->
  <line x1="120" y1="400" x2="170" y2="400" stroke="rgba(0,0,0,0)" stroke-width="3"/>
  <path d="M 120 400 A 50 50 0 0 0 120 350" fill="none" stroke="rgba(184,152,72,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="120" y1="400" x2="120" y2="350" stroke="rgba(184,152,72,0.4)" stroke-width="1.5"/>
  <!-- Unit B entrance -->
  <path d="M 430 400 A 45 45 0 0 0 475 400" fill="none" stroke="rgba(184,152,72,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="430" y1="400" x2="430" y2="355" stroke="rgba(184,152,72,0.4)" stroke-width="1.5"/>
  <!-- Unit C entrance -->
  <path d="M 730 400 A 50 50 0 0 1 730 350" fill="none" stroke="rgba(184,152,72,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="730" y1="400" x2="730" y2="350" stroke="rgba(184,152,72,0.4)" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- UNIT LABELS                                    -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Unit A label -->
  <text x="186" y="120" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="300" letter-spacing="4" fill="rgba(244,241,234,0.6)">UNIDAD A</text>
  <text x="186" y="148" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8.5" font-weight="300" letter-spacing="2" fill="rgba(184,152,72,0.55)">2 DORMITORIOS</text>
  <text x="186" y="170" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.38)">98 m²</text>
  <!-- Room labels inside A -->
  <text x="126" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">SALÓN</text>
  <text x="252" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">DORM</text>
  <text x="186" y="320" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">COCINA</text>

  <!-- Unit B label -->
  <text x="450" y="120" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="300" letter-spacing="4" fill="rgba(244,241,234,0.6)">UNIDAD B</text>
  <text x="450" y="148" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8.5" font-weight="300" letter-spacing="2" fill="rgba(184,152,72,0.55)">3 DORMITORIOS</text>
  <text x="450" y="170" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.38)">125 m²</text>
  <!-- Room labels inside B -->
  <text x="390" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">SALÓN</text>
  <text x="512" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">DORM</text>
  <text x="450" y="320" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">COCINA</text>

  <!-- Unit C label -->
  <text x="714" y="120" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="300" letter-spacing="4" fill="rgba(244,241,234,0.6)">UNIDAD C</text>
  <text x="714" y="148" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8.5" font-weight="300" letter-spacing="2" fill="rgba(184,152,72,0.55)">2 DORMITORIOS</text>
  <text x="714" y="170" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="1.5" fill="rgba(184,152,72,0.38)">85 m²</text>
  <!-- Room labels inside C -->
  <text x="648" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">SALÓN</text>
  <text x="770" y="200" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">DORM</text>
  <text x="714" y="320" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="2" fill="rgba(244,241,234,0.3)">COCINA</text>

  <!-- Corridor label -->
  <text x="260" y="458" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="8" font-weight="300" letter-spacing="3" fill="rgba(244,241,234,0.3)">CORREDOR COMÚN</text>

  <!-- ── Floor tag ── -->
  <rect x="50" y="45" width="72" height="22" fill="rgba(184,152,72,0.1)" stroke="rgba(184,152,72,0.3)" stroke-width="1"/>
  <text x="86" y="60" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="400" letter-spacing="1.5" fill="rgba(184,152,72,0.8)">PLANTA TIPO</text>

  <!-- ── North arrow ── -->
  <g transform="translate(820, 510)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="rgba(184,152,72,0.3)" stroke-width="1"/>
    <polygon points="0,-11 -4,-3 4,-3" fill="rgba(184,152,72,0.75)"/>
    <polygon points="0,11 -4,3 4,3" fill="rgba(184,152,72,0.2)"/>
    <text x="0" y="25" text-anchor="middle" font-family="Montserrat" font-size="8" font-weight="300" fill="rgba(184,152,72,0.65)" letter-spacing="1">N</text>
  </g>

  <!-- ── Scale bar ── -->
  <g transform="translate(80, 548)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="50" y1="-3" x2="50" y2="3" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="rgba(184,152,72,0.4)" stroke-width="1"/>
    <text x="50" y="-9" text-anchor="middle" font-family="Montserrat" font-size="7" font-weight="300" fill="rgba(184,152,72,0.45)" letter-spacing="1.5">10 m</text>
  </g>

  <!-- ── Project label ── -->
  <text x="450" y="562" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="7.5" font-weight="300" letter-spacing="5" fill="rgba(184,152,72,0.3)">LAS CONCHAS · MARBELLA</text>
</svg>
